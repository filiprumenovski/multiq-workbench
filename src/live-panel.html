<fieldset id="live-controls" disabled>
  <label class="form-label preset-label">Reference system<select id="live-preset" class="form-select"><option value="s14">S14 · Bak BH3 + Na</option><option value="fig5">Fig. 5 · ubiquitin 6+–10+</option></select></label>
  <div class="transport-controls"><button type="button" class="btn btn-primary" id="live-pause">Pause</button><button type="button" class="btn" id="live-step" title="Advance the simulation by one step">Step</button><button type="button" class="btn" id="live-reset" title="Restart the live ion beam">Reset</button></div>
  <div id="settings-lock" class="settings-lock" hidden>Study in progress. Cancel it in Optimize to change conditions.</div>
  <div class="settings-section"><span class="eyebrow">DRIVE</span><div class="live-parameters">
    <div class="parameter-control"><div class="parameter-heading"><label for="live-frequency">Frequency</label><span class="input-unit"><input id="live-frequency" type="number" min="20" max="120" step="any" value="83"><span>kHz</span></span></div><input id="live-frequency-slider" class="parameter-slider" type="range" min="20" max="120" step="0.1" value="83" aria-label="Frequency slider" data-unit="kHz"></div>
    <div class="parameter-control"><div class="parameter-heading"><label for="live-rf">RF amplitude</label><span class="input-unit"><input id="live-rf" type="number" min="40" max="100" step="any" value="70"><span>±V</span></span></div><input id="live-rf-slider" class="parameter-slider" type="range" min="40" max="100" step="1" value="70" aria-label="RF amplitude slider" data-unit="±V"></div>
    <div class="parameter-control"><div class="parameter-heading"><label for="live-ac">AC amplitude</label><span class="input-unit"><input id="live-ac" type="number" min="0" max="1" step="any" value="0.35"><span>±V</span></span></div><input id="live-ac-slider" class="parameter-slider" type="range" min="0" max="1" step="0.0025" value="0.35" aria-label="AC amplitude slider" data-unit="±V"></div>
  </div></div>
  <div class="settings-section"><span class="eyebrow">CHANNEL</span><div class="live-parameters">
    <div class="parameter-control"><div class="parameter-heading"><label for="live-gate">Gate potential</label><span class="input-unit"><input id="live-gate" type="number" min="18" max="30" step="any" value="24"><span>V</span></span></div><input id="live-gate-slider" class="parameter-slider" type="range" min="18" max="30" step="0.1" value="24" aria-label="Gate potential slider" data-unit="V"></div>
    <div class="parameter-control"><div class="parameter-heading"><label for="live-pressure">N₂ pressure</label><span class="input-unit"><input id="live-pressure" type="number" min="0.02" max="0.3" step="any" value="0.1"><span>Pa</span></span></div><input id="live-pressure-slider" class="parameter-slider" type="range" min="0.02" max="0.3" step="0.01" value="0.1" aria-label="N₂ pressure slider" data-unit="Pa"></div>
  </div><label class="form-check recirculate"><input id="live-recirculate" type="checkbox" checked>Recirculate returned ions</label><p class="field-help">Recirculation uses mqviz’s delay model.</p></div>
</fieldset>
