[package]
name = "multiq-desktop"
version = "0.1.0"
edition = "2021"
description = "MultiQ-IT instrument render and channel simulation workbench"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
trapsim = { path = "../simulation/trapsim" }
rayon = "1"
tauri = { version = "=2.11.5", features = [] }
mqviz = { path = "../simulation/mqviz" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
